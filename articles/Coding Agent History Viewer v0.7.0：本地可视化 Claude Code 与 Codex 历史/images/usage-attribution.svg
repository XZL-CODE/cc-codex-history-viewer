<rect width="1200" height="580" fill="#FFFFFF"/>
<text x="600.0" y="44.0" font-size="24" fill="#1F2937" font-weight="800" text-anchor="middle">用量归属：一次调用只计入它第一次出现的会话</text>
<rect x="30.0" y="70.0" width="1140.0" height="80.0" rx="14" fill="#FAFAFA"/>
<text x="44.0" y="110.0" font-size="17" fill="#1F2937" font-weight="700">会话 A（原始）</text>
<text x="44.0" y="134.0" font-size="14" fill="#6B7280">10:00 开始</text>
<rect x="30.0" y="190.0" width="1140.0" height="80.0" rx="14" fill="#FAFAFA"/>
<text x="44.0" y="230.0" font-size="17" fill="#1F2937" font-weight="700">A/subagents/S1（子代理）</text>
<text x="44.0" y="254.0" font-size="14" fill="#6B7280">11:20 开始</text>
<rect x="30.0" y="310.0" width="1140.0" height="80.0" rx="14" fill="#FAFAFA"/>
<text x="44.0" y="350.0" font-size="17" fill="#1F2937" font-weight="700">会话 B（resume 自 A）</text>
<text x="44.0" y="374.0" font-size="14" fill="#6B7280">14:00 开始</text>
<rect x="330.0" y="88.0" width="70.0" height="44.0" rx="10" fill="#FFF1E3" stroke="#FF6A00" stroke-width="2"/><text x="365.0" y="116.0" font-size="16" fill="#1F2937" font-weight="700" text-anchor="middle">k1</text>
<rect x="416.0" y="88.0" width="70.0" height="44.0" rx="10" fill="#FFF1E3" stroke="#FF6A00" stroke-width="2"/><text x="451.0" y="116.0" font-size="16" fill="#1F2937" font-weight="700" text-anchor="middle">k2</text>
<rect x="502.0" y="88.0" width="70.0" height="44.0" rx="10" fill="#FFF1E3" stroke="#FF6A00" stroke-width="2"/><text x="537.0" y="116.0" font-size="16" fill="#1F2937" font-weight="700" text-anchor="middle">k3</text>
<rect x="330.0" y="208.0" width="70.0" height="44.0" rx="10" fill="#E9F9EF" stroke="#27AE60" stroke-width="2"/><text x="365.0" y="236.0" font-size="16" fill="#1F2937" font-weight="700" text-anchor="middle">k5</text>
<rect x="330.0" y="328.0" width="70.0" height="44.0" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/><text x="365.0" y="356.0" font-size="16" fill="#6B7280" font-weight="700" text-anchor="middle">k1</text>
<rect x="416.0" y="328.0" width="70.0" height="44.0" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/><text x="451.0" y="356.0" font-size="16" fill="#6B7280" font-weight="700" text-anchor="middle">k2</text>
<rect x="502.0" y="328.0" width="70.0" height="44.0" rx="10" fill="#EAF3FF" stroke="#2F80ED" stroke-width="2"/><text x="537.0" y="356.0" font-size="16" fill="#1F2937" font-weight="700" text-anchor="middle">k4</text>
<text x="330.0" y="392.0" font-size="13" fill="#6B7280">k1、k2 是复制品，已在 A 中出现 → 跳过</text>
<polyline points="588.0,110.0 720.0,110.0 720.0,122.0 758.0,122.0" fill="none" stroke="#FF6A00" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrFF6A00)"/>
<polyline points="400.0,230.0 690.0,230.0 690.0,156.0 758.0,156.0" fill="none" stroke="#27AE60" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr27AE60)"/>
<polyline points="572.0,350.0 758.0,350.0" fill="none" stroke="#2F80ED" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr2F80ED)"/>
<rect x="760.0" y="88.0" width="400.0" height="100.0" rx="14" fill="#FFF1E3" stroke="#FF6A00" stroke-width="2"/><text x="780.0" y="118.0" font-size="17" fill="#1F2937" font-weight="700">会话 A 的用量</text><rect x="780.0" y="130.0" width="56.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#FF6A00" stroke-width="1.5"/><text x="808.0" y="150.0" font-size="14" fill="#1F2937" font-weight="700" text-anchor="middle">k1</text><rect x="846.0" y="130.0" width="56.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#FF6A00" stroke-width="1.5"/><text x="874.0" y="150.0" font-size="14" fill="#1F2937" font-weight="700" text-anchor="middle">k2</text><rect x="912.0" y="130.0" width="56.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#FF6A00" stroke-width="1.5"/><text x="940.0" y="150.0" font-size="14" fill="#1F2937" font-weight="700" text-anchor="middle">k3</text><rect x="978.0" y="130.0" width="56.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#27AE60" stroke-width="1.5"/><text x="1006.0" y="150.0" font-size="14" fill="#1F2937" font-weight="700" text-anchor="middle">k5</text><text x="780.0" y="178.0" font-size="13" fill="#6B7280">k5 来自子代理，并入父会话</text>
<rect x="760.0" y="300.0" width="400.0" height="100.0" rx="14" fill="#EAF3FF" stroke="#2F80ED" stroke-width="2"/><text x="780.0" y="330.0" font-size="17" fill="#1F2937" font-weight="700">会话 B 的用量</text><rect x="780.0" y="342.0" width="56.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#2F80ED" stroke-width="1.5"/><text x="808.0" y="362.0" font-size="14" fill="#1F2937" font-weight="700" text-anchor="middle">k4</text><text x="780.0" y="390.0" font-size="13" fill="#6B7280">复制进来的 k1、k2 只计入 A</text>
<rect x="760.0" y="430.0" width="400.0" height="100.0" rx="14" fill="#E9F9EF" stroke="#27AE60" stroke-width="2"/><text x="780.0" y="460.0" font-size="17" fill="#1F2937" font-weight="700">全局用量</text><rect x="780.0" y="472.0" width="56.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#FF6A00" stroke-width="1.5"/><text x="808.0" y="492.0" font-size="14" fill="#1F2937" font-weight="700" text-anchor="middle">k1</text><rect x="846.0" y="472.0" width="56.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#FF6A00" stroke-width="1.5"/><text x="874.0" y="492.0" font-size="14" fill="#1F2937" font-weight="700" text-anchor="middle">k2</text><rect x="912.0" y="472.0" width="56.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#FF6A00" stroke-width="1.5"/><text x="940.0" y="492.0" font-size="14" fill="#1F2937" font-weight="700" text-anchor="middle">k3</text><rect x="978.0" y="472.0" width="56.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#2F80ED" stroke-width="1.5"/><text x="1006.0" y="492.0" font-size="14" fill="#1F2937" font-weight="700" text-anchor="middle">k4</text><rect x="1044.0" y="472.0" width="56.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#27AE60" stroke-width="1.5"/><text x="1072.0" y="492.0" font-size="14" fill="#1F2937" font-weight="700" text-anchor="middle">k5</text><text x="780.0" y="520.0" font-size="13" fill="#6B7280">同样按 dedup_key 去重</text>
<rect x="30.0" y="430.0" width="700.0" height="100.0" rx="14" fill="#FFFBF5" stroke="#FFB020" stroke-width="1.5"/>
<text x="50.0" y="462.0" font-size="15" fill="#4B5563">规则：按会话开始时间顺序遍历所有文件，(agent, dedup_key) 首次出现的会话得到这条用量，</text>
<text x="50.0" y="488.0" font-size="15" fill="#4B5563">后续同键事件视为复制品；子代理文件并入父会话。于是自然得到可用测试锁死的不变量：</text>
<text x="50.0" y="516.0" font-size="17" fill="#9A3412" font-weight="800">Σ 会话用量 = 全局用量</text>
</svg>
