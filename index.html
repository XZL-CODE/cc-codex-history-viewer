<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Agent History Viewer</title>
    <script>
      try {
        var savedTheme = localStorage.getItem("cchv-theme");
        var prefersDark =
          savedTheme === "dark" ||
          (savedTheme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (prefersDark) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
