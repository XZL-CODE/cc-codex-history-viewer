[package]
name = "cc-history-viewer"
version = "0.8.0"
description = "Local history viewer for Claude Code and OpenAI Codex"
authors = ["xzl"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cc_history_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
walkdir = "2"
chrono = { version = "0.4", features = ["clock"] }
rayon = "1"
# 导入 zip 包：只需 deflate（zip -r 与 Finder 压缩的默认算法）
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
